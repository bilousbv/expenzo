packages:
  - "apps/*"
  - "packages/*"

# Metro (React Native) does not follow pnpm's symlinked store reliably,
# so the mobile app needs a flat node_modules tree.
nodeLinker: hoisted

allowBuilds:
  unrs-resolver: true
  esbuild: true
  playwright: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.2'
  - '@tanstack/react-query@5.102.2'
