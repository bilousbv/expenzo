packages:
  - "apps/*"
  - "packages/*"

# Metro (React Native) does not follow pnpm's symlinked store reliably,
# so the mobile app needs a flat node_modules tree.
nodeLinker: hoisted

allowBuilds:
  unrs-resolver: true
  esbuild: true
  playwright: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.2'
  - '@tanstack/react-query@5.102.2'
  - '@expo/metro-runtime@57.0.13'
  - '@expo/ui@57.0.13'
  - expo-constants@57.0.14
  - expo-router@57.0.16
  - '@expo/cli@57.0.18'
  - '@expo/config-plugins@57.0.9'
  - '@expo/config@57.0.9'
  - '@expo/fingerprint@0.20.10'
  - '@expo/image-utils@0.11.5'
  - '@expo/metro-config@57.0.10'
  - '@expo/metro-file-map@57.0.2'
  - '@expo/prebuild-config@57.0.14'
  - '@expo/require-utils@57.0.5'
  - babel-preset-expo@57.0.8
  - expo-asset@57.0.14
  - expo-modules-autolinking@57.0.11
  - expo-modules-core@57.0.13
  - expo@57.0.16
