packages:
  - "apps/*"
  - "packages/*"

# Metro (React Native) does not follow pnpm's symlinked store reliably,
# so the mobile app needs a flat node_modules tree.
nodeLinker: hoisted

# React Native tolerates exactly one copy of React in the tree. The root
# workspace depends on react-i18next without pinning React, so pnpm was free to
# resolve that peer to whatever was newest and gave it a nested copy — two
# Reacts, and every hook in the mobile suite failing with "Cannot read
# properties of null (reading 'useContext')". Pinning it here is what keeps the
# web app, the native app and the shared packages on one instance.
#
# The React typings are pinned for the same reason: they declare globals, the
# hoisted linker leaves exactly one copy standing, and Expo checks the version
# it finds against what SDK 54 was built for.
overrides:
  react: 19.1.0
  react-dom: 19.1.0
  "@types/react": ~19.1.10
  "@types/react-dom": ~19.1.9

allowBuilds:
  unrs-resolver: true
  esbuild: true
  playwright: true
